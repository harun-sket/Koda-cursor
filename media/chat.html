<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script nonce="{{NONCE}}" src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root {
    --acc: var(--vscode-textLink-foreground, #ff8c1a);
    --bg: var(--vscode-sideBar-background, #1e1e1e);
    --fg: var(--vscode-foreground, #ddd);
    --mut: var(--vscode-descriptionForeground, #888);
    --bd: var(--vscode-panel-border, #333);
    --panel: var(--vscode-editor-background, #252526);
    --in-bg: var(--vscode-input-background, #3c3c3c);
    --btn: var(--vscode-button-background, #0e639c);
    --btn-fg: var(--vscode-button-foreground, #fff);
    --hover: var(--vscode-list-hoverBackground, #2a2d2e);
    --code-bg: var(--vscode-textCodeBlock-background, #1e1e1e);
    --err: var(--vscode-errorForeground, #f48771);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: var(--vscode-font-family, system-ui); font-size: var(--vscode-font-size, 13px); color: var(--fg); background: var(--bg); overflow: hidden; }
  body { display: flex; flex-direction: column; position: relative; }
  header { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--bd); background: var(--panel); flex-shrink: 0; }
  .logo { font-weight: 800; color: var(--acc); letter-spacing: .5px; font-size: 13px; }
  .model-badge { font-size: 9px; color: var(--mut); background: var(--in-bg); border: 1px solid var(--bd); border-radius: 8px; padding: 1px 6px; text-transform: uppercase; letter-spacing: .5px; margin-left: 4px; }
  .spacer { flex: 1; }
  .ic-btn { background: transparent; border: 1px solid transparent; color: var(--mut); border-radius: 4px; padding: 4px 7px; cursor: pointer; font-size: 13px; font-family: inherit; line-height: 1; }
  .ic-btn:hover { color: var(--fg); background: var(--hover); }
  .ic-btn.on { color: var(--acc); border-color: var(--acc); }
  #msgs { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 14px; }
  .welcome { text-align: center; color: var(--mut); padding: 24px 12px; font-size: 12px; line-height: 1.6; }
  .welcome b { color: var(--acc); display: block; margin-bottom: 8px; font-size: 15px; }
  .welcome kbd { background: var(--code-bg); border: 1px solid var(--bd); border-radius: 3px; padding: 1px 5px; font-size: 11px; font-family: var(--vscode-editor-font-family, monospace); }
  .chips { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; max-width: 260px; margin-left: auto; margin-right: auto; }
  .chip-starter { background: var(--in-bg); border: 1px solid var(--bd); color: var(--fg); padding: 8px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; text-align: left; font-family: inherit; transition: all .15s; }
  .chip-starter:hover { border-color: var(--acc); color: var(--acc); }
  .msg { padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.6; word-wrap: break-word; position: relative; }
  .msg.u { align-self: flex-end; background: var(--in-bg); border-bottom-right-radius: 3px; max-width: 88%; padding: 8px 12px; font-size: 12.5px; }
  .msg.k { align-self: flex-start; background: transparent; border: none; border-bottom-left-radius: 3px; max-width: 100%; padding: 4px 2px; }
  .msg.k p { margin-bottom: 8px; }
  .msg.k p:last-child { margin-bottom: 0; }
  .msg.k strong { font-weight: 700; }
  .msg.k em { color: var(--mut); }
  .msg.k h1, .msg.k h2, .msg.k h3, .msg.k h4 { margin: 10px 0 5px; font-size: 1.05em; border-bottom: 1px solid var(--bd); padding-bottom: 3px; }
  .msg.k h1 { font-size: 1.18em; }
  .msg.k ul, .msg.k ol { padding-left: 20px; margin: 6px 0; }
  .msg.k li { margin-bottom: 3px; }
  .msg.k code { background: var(--code-bg); padding: 2px 6px; border-radius: 3px; font-family: var(--vscode-editor-font-family, monospace); font-size: .9em; color: var(--acc); }
  .msg.k pre { background: var(--code-bg); border-left: 3px solid var(--acc); border-radius: 6px; padding: 12px 14px; overflow-x: auto; margin: 10px 0; position: relative; font-size: 12px; }
  .msg.k pre code { background: transparent; padding: 0; color: inherit; font-size: 12px; display: block; white-space: pre; }
  .copy-code { position: absolute; top: 6px; right: 6px; background: var(--btn); color: var(--btn-fg); border: none; border-radius: 3px; padding: 2px 6px; font-size: 10px; cursor: pointer; opacity: 0; transition: opacity .15s; }
  .msg.k pre:hover .copy-code { opacity: 1; }
  .msg-actions { display: flex; gap: 4px; margin-top: 8px; opacity: 0; transition: opacity .15s; flex-wrap: wrap; }
  .msg:hover .msg-actions { opacity: 1; }
  .msg-actions button { background: transparent; border: 1px solid var(--bd); color: var(--mut); border-radius: 3px; padding: 2px 8px; font-size: 10px; cursor: pointer; font-family: inherit; }
  .msg-actions button:hover { color: var(--acc); border-color: var(--acc); }
  .edit-card { margin-top: 8px; border: 1px solid var(--bd); border-radius: 6px; background: var(--code-bg); overflow: hidden; }
  .edit-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--bd); font-size: 11px; font-family: var(--vscode-editor-font-family, monospace); }
  .edit-head .path { color: var(--acc); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .edit-head button { background: var(--btn); color: var(--btn-fg); border: none; border-radius: 3px; padding: 2px 8px; font-size: 10px; cursor: pointer; font-family: inherit; }
  .edit-head button.ghost { background: transparent; color: var(--mut); border: 1px solid var(--bd); }
  .edit-head button:hover { filter: brightness(1.15); }
  .sources { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--bd); font-size: 11px; }
  .sources-title { color: var(--mut); text-transform: uppercase; font-size: 9px; letter-spacing: .5px; margin-bottom: 4px; }
  .sources a { display: flex; gap: 5px; color: var(--acc); text-decoration: none; padding: 2px 0; word-break: break-word; }
  .sources a:hover { text-decoration: underline; }
  .sources .n { color: var(--mut); flex-shrink: 0; min-width: 14px; }
  .skeleton { display: flex; gap: 4px; padding: 10px 14px; }
  .skeleton span { display: inline-block; width: 6px; height: 6px; background: var(--mut); border-radius: 50%; animation: b 1.2s infinite; }
  .skeleton span:nth-child(2) { animation-delay: .15s; }
  .skeleton span:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
  footer { border-top: 1px solid var(--bd); padding: 10px; background: var(--panel); flex-shrink: 0; }
  .chips-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--code-bg); border: 1px solid var(--bd); border-radius: 10px; padding: 2px 6px 2px 8px; font-size: 10px; color: var(--mut); }
  .chip .x { cursor: pointer; color: var(--mut); }
  .chip .x:hover { color: var(--err); }
  .chip.mention .label { color: var(--acc); }
  .input-wrap { position: relative; }
  textarea#in { width: 100%; background: var(--in-bg); color: var(--fg); border: 1px solid var(--bd); border-radius: 10px; padding: 12px 14px; font-family: inherit; font-size: 13px; resize: none; height: 52px; max-height: 180px; line-height: 1.5; outline: none; transition: border-color .15s; }
  textarea#in:focus { border-color: var(--acc); }
  .input-row { display: flex; gap: 6px; margin-top: 8px; align-items: flex-end; }
  .send-btn { background: var(--btn); color: var(--btn-fg); border: none; border-radius: 8px; width: 52px; height: 44px; cursor: pointer; flex-shrink: 0; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; transition: filter .15s; }
  .send-btn:disabled { opacity: .5; cursor: not-allowed; }
  .send-btn:hover { filter: brightness(1.15); }
  .stop-btn { background: var(--err); color: #fff; border: none; border-radius: 8px; width: 60px; height: 44px; cursor: pointer; flex-shrink: 0; font-size: 11px; font-weight: 700; display: none; align-items: center; justify-content: center; font-family: inherit; }
  .stop-btn.on { display: inline-flex; }
  .msg.k.streaming::after { content: ''; display: inline-block; width: 7px; height: 7px; background: var(--acc); border-radius: 50%; animation: pulse 1s ease-in-out infinite; margin-left: 5px; vertical-align: middle; }
  .autocomplete { position: absolute; bottom: 100%; left: 0; right: 0; background: var(--panel); border: 1px solid var(--bd); border-radius: 6px; max-height: 200px; overflow-y: auto; z-index: 50; margin-bottom: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); display: none; }
  .autocomplete.on { display: block; }
  .ac-item { padding: 6px 10px; cursor: pointer; font-size: 11px; font-family: var(--vscode-editor-font-family, monospace); color: var(--fg); display: flex; align-items: center; gap: 6px; }
  .ac-item:hover, .ac-item.active { background: var(--hover); }
  .ac-item .type { color: var(--mut); font-size: 9px; text-transform: uppercase; }
  .slash-menu { position: absolute; bottom: 100%; left: 0; right: 0; background: var(--panel); border: 1px solid var(--bd); border-radius: 6px; max-height: 220px; overflow-y: auto; z-index: 51; margin-bottom: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); display: none; }
  .slash-menu.on { display: block; }
  .slash-item { padding: 6px 10px; cursor: pointer; font-size: 11px; font-family: var(--vscode-editor-font-family, monospace); color: var(--fg); display: flex; align-items: center; gap: 8px; }
  .slash-item:hover, .slash-item.active { background: var(--hover); }
  .slash-item .cmd { color: var(--acc); font-weight: 700; }
  .slash-item .desc { color: var(--mut); }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); display: none; z-index: 100; }
  .overlay.on { display: block; }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 86%; background: var(--panel); border-left: 1px solid var(--bd); transform: translateX(100%); transition: transform .2s ease; z-index: 101; display: flex; flex-direction: column; }
  .drawer.on { transform: translateX(0); }
  .drawer-head { padding: 10px; border-bottom: 1px solid var(--bd); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .drawer-title { font-weight: 700; font-size: 12px; }
  .drawer-new { background: var(--btn); color: var(--btn-fg); border: none; border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: inherit; }
  .drawer-new:hover { filter: brightness(1.15); }
  .drawer-list { flex: 1; overflow-y: auto; padding: 6px; }
  .group-label { font-size: 9px; color: var(--mut); text-transform: uppercase; letter-spacing: .6px; padding: 8px 10px 4px; }
  .conv-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--fg); }
  .conv-row:hover { background: var(--hover); }
  .conv-row.on { background: var(--hover); border-left: 2px solid var(--acc); }
  .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-del { color: var(--mut); padding: 0 4px; cursor: pointer; font-size: 14px; line-height: 1; }
  .conv-del:hover { color: var(--err); }
  .conv-empty { color: var(--mut); text-align: center; padding: 20px; font-size: 11px; }
  .search-box { margin: 6px 8px 0; }
  .search-box input { width: 100%; background: var(--in-bg); border: 1px solid var(--bd); border-radius: 6px; color: var(--fg); padding: 6px 10px; font-size: 11px; font-family: inherit; outline: none; }
  .search-box input:focus { border-color: var(--acc); }
  .settings-section { padding: 10px 12px; border-bottom: 1px solid var(--bd); }
  .settings-label { font-size: 9px; color: var(--mut); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 12px; }
  .settings-row label { color: var(--fg); }
  .settings-row select, .settings-row input[type=number], .settings-row input[type=text] { background: var(--in-bg); color: var(--fg); border: 1px solid var(--bd); border-radius: 4px; padding: 4px 8px; font-size: 11px; font-family: inherit; outline: none; min-width: 120px; }
  .settings-row select:focus, .settings-row input:focus { border-color: var(--acc); }
  .settings-row input[type=range] { min-width: 120px; accent-color: var(--acc); }
  .toggle { position: relative; width: 32px; height: 18px; background: var(--bd); border-radius: 12px; cursor: pointer; transition: background .2s; flex-shrink: 0; }
  .toggle.on { background: var(--acc); }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform .2s; }
  .toggle.on::after { transform: translateX(14px); }
  .reset-btn { width: 100%; background: transparent; border: 1px solid var(--err); color: var(--err); border-radius: 6px; padding: 8px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; margin: 12px; width: calc(100% - 24px); }
  .reset-btn:hover { background: rgba(244,135,113,0.1); }
  .temp-val { color: var(--acc); font-weight: 700; margin-left: 8px; min-width: 32px; text-align: right; }
</style>
</head>
<body>
<header>
  <span class="logo">KODA</span>
  <span class="model-badge" id="modelBadge">auto</span>
  <span class="spacer"></span>
  <button class="ic-btn" id="chatsBtn" title="Conversations">&#9776;</button>
  <button class="ic-btn" id="webBtn" title="Toggle web search">&#9678;</button>
  <button class="ic-btn" id="settingsBtn" title="Settings">&#9881;</button>
  <button class="ic-btn" id="clearBtn" title="Clear current">&#128465;</button>
</header>
<div id="msgs">
  <div class="welcome">
    <b>KODA — AI Code Editor</b>
    Ask anything. Use @ for files, / for commands.
    <div class="chips">
      <button class="chip-starter" data-action="explain">Explain this file</button>
      <button class="chip-starter" data-action="fix">Find bugs in this code</button>
      <button class="chip-starter" data-action="test">Write tests for me</button>
      <button class="chip-starter" data-action="refactor">Refactor this function</button>
    </div>
  </div>
</div>
<footer>
  <div class="chips-row" id="chips"></div>
  <div class="input-wrap">
    <textarea id="in" placeholder="Ask KODA… (@ files, / commands)"></textarea>
    <div class="autocomplete" id="ac"></div>
    <div class="slash-menu" id="slashMenu"></div>
  </div>
  <div class="input-row">
    <button class="send-btn" id="sendBtn" title="Send">&gt;</button>
    <button class="stop-btn" id="stopBtn" title="Stop">STOP</button>
  </div>
</footer>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="drawer-title">Conversations</span>
    <button class="drawer-new" id="drawerNew">+ New</button>
  </div>
  <div class="search-box"><input type="text" id="drawerSearch" placeholder="Search…"></div>
  <div class="drawer-list" id="drawerList"></div>
</div>
<div class="drawer" id="settingsDrawer">
  <div class="drawer-head">
    <span class="drawer-title">Settings</span>
    <button class="drawer-new" id="settingsClose">Close</button>
  </div>
  <div style="flex:1;overflow-y:auto;">
    <div class="settings-section">
      <div class="settings-label">Model</div>
      <div class="settings-row">
        <label>Model</label>
        <select id="set-model">
          <option value="auto">Auto (fallback)</option>
          <option value="smart">Smart (120b)</option>
          <option value="fast">Fast (20b)</option>
          <option value="code-master">Code Master</option>
        </select>
      </div>
      <div class="settings-row">
        <label>Temperature <span class="temp-val" id="tempVal">0.6</span></label>
        <input type="range" id="set-temperature" min="0" max="1" step="0.05">
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-label">Behavior</div>
      <div class="settings-row"><label>Auto-apply edits</label><div class="toggle" id="set-autoApply"></div></div>
      <div class="settings-row"><label>Web search by default</label><div class="toggle" id="set-webSearchByDefault"></div></div>
      <div class="settings-row"><label>Show sources</label><div class="toggle" id="set-showSources"></div></div>
      <div class="settings-row"><label>Confirm before delete</label><div class="toggle" id="set-confirmDelete"></div></div>
    </div>
    <div class="settings-section">
      <div class="settings-label">Context</div>
      <div class="settings-row"><label>Max open files</label><input type="number" id="set-maxContextFiles" min="1" max="20"></div>
    </div>
    <div class="settings-section">
      <div class="settings-label">Advanced</div>
      <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:4px;">
        <label>Worker URL</label>
        <input type="text" id="set-workerUrl">
      </div>
    </div>
    <button class="reset-btn" id="resetSettings">Reset to defaults</button>
  </div>
</div>
<script nonce="{{NONCE}}">
const vscode = acquireVsCodeApi();
const $ = id => document.getElementById(id);
const msgsEl = $('msgs'), inEl = $('in'), sendBtn = $('sendBtn'), stopBtn = $('stopBtn');
const webBtn = $('webBtn'), clearBtn = $('clearBtn'), chipsEl = $('chips');
const acEl = $('ac'), slashMenu = $('slashMenu');
const chatsBtn = $('chatsBtn'), drawer = $('drawer'), overlay = $('overlay'), drawerList = $('drawerList'), drawerNew = $('drawerNew'), drawerSearch = $('drawerSearch');
const settingsBtn = $('settingsBtn'), settingsDrawer = $('settingsDrawer'), settingsClose = $('settingsClose');
const modelBadge = $('modelBadge');

let state = { messages: [], webSearch: {{WEBSEARCH_DEFAULT}}, mentions: [], pendingSelection: null };
let config = {{CONFIG_JSON}};
let conversations = [];
let currentId = null;
let isSending = false;
let fileList = [];
let acIndex = 0, acMode = null;
let streamEl = null, streamRaw = '';
let slashActive = false, slashIndex = 0;

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderMarkdown(src) {
  let html = escapeHtml(src);
  const edits = [];
  html = html.replace(/```(\w+)?[ \t]+path=([^\s`]+)[ \t]*\n([\s\S]*?)```/g, (_, lang, p, code) => {
    const t = '%%EDIT' + edits.length + '%%';
    edits.push({ lang: lang || 'text', path: p.trim(), code: code.replace(/\n$/, '') });
    return t;
  });
  const blocks = [];
  html = html.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) => {
    const t = '%%BLK' + blocks.length + '%%';
    const cls = lang ? ' class="language-' + lang + '"' : '';
    blocks.push('<pre><code' + cls + '>' + code.replace(/\n$/, '') + '</code></pre>');
    return t;
  });
  const inl = [];
  html = html.replace(/`([^`\n]+)`/g, (_, c) => {
    const t = '%%INL' + inl.length + '%%';
    inl.push('<code>' + c + '</code>');
    return t;
  });
  html = html
    .replace(/^###\s+(.*)$/gm, '<h4>$1</h4>')
    .replace(/^##\s+(.*)$/gm, '<h3>$1</h3>')
    .replace(/^#\s+(.*)$/gm, '<h2>$1</h2>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  html = html.replace(/(?:^|\n)((?:[-*]\s+.*(?:\n|$))+)/g, (_, b) => {
    const items = b.trim().split('\n').map(l => '<li>' + l.replace(/^[-*]\s+/, '') + '</li>').join('');
    return '\n<ul>' + items + '</ul>\n';
  });
  html = html.replace(/(?:^|\n)((?:\d+\.\s+.*(?:\n|$))+)/g, (_, b) => {
    const items = b.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\.\s+/, '') + '</li>').join('');
    return '\n<ol>' + items + '</ol>\n';
  });
  html = html.replace(/%%INL(\d+)%%/g, (_, i) => inl[+i]);
  html = html.replace(/%%BLK(\d+)%%/g, (_, i) => blocks[+i]);
  html = html.replace(/%%EDIT(\d+)%%/g, (_, i) => {
    const e = edits[+i];
    return '<pre><code class="language-' + e.lang + '">' + e.code + '</code></pre>';
  });
  return html.split(/\n{2,}/).map(p =>
    /^\s*<(pre|h[1-6]|ul|ol|blockquote)/.test(p) ? p : '<p>' + p.replace(/\n/g, '<br>') + '</p>'
  ).join('');
}

function renderMessages() {
  msgsEl.innerHTML = '';
  if (!state.messages.length) {
    msgsEl.innerHTML =
      '<div class="welcome"><b>KODA — AI Code Editor</b>' +
      'Ask anything. Use @ for files, / for commands.' +
      '<div class="chips">' +
      '<button class="chip-starter" data-action="explain">Explain this file</button>' +
      '<button class="chip-starter" data-action="fix">Find bugs in this code</button>' +
      '<button class="chip-starter" data-action="test">Write tests for me</button>' +
      '<button class="chip-starter" data-action="refactor">Refactor this function</button>' +
      '</div></div>';
    msgsEl.querySelectorAll('.chip-starter').forEach(b => {
      b.onclick = () => {
        const action = b.dataset.action;
        const commands = { explain: '/explain', fix: '/fix', test: '/test', refactor: '/refactor' };
        inEl.value = commands[action] || '/explain';
        send(inEl.value);
      };
    });
    return;
  }
  state.messages.forEach((m, idx) => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role === 'user' ? 'u' : 'k');
    if (m.role === 'assistant') {
      div.innerHTML = renderMarkdown(m.content);
      if (Array.isArray(m.edits) && m.edits.length) {
        m.edits.forEach(e => {
          const card = document.createElement('div');
          card.className = 'edit-card';
          const head = document.createElement('div');
          head.className = 'edit-head';
          const p = document.createElement('span');
          p.className = 'path'; p.textContent = e.path;
          const viewBtn = document.createElement('button');
          viewBtn.className = 'ghost'; viewBtn.textContent = 'View diff';
          viewBtn.onclick = () => vscode.postMessage({ type: 'openDiff', edit: e });
          const applyBtn = document.createElement('button');
          applyBtn.textContent = 'Apply';
          applyBtn.onclick = () => {
            vscode.postMessage({ type: 'applyEdit', edit: e });
            applyBtn.textContent = 'Applied';
            applyBtn.disabled = true;
          };
          head.appendChild(p); head.appendChild(viewBtn); head.appendChild(applyBtn);
          card.appendChild(head);
          div.appendChild(card);
        });
        const applyAll = document.createElement('button');
        applyAll.style.cssText = 'display:inline-flex;margin-top:6px;background:var(--btn);color:var(--btn-fg);border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit';
        applyAll.textContent = 'Apply all ' + m.edits.length + ' file(s)';
        applyAll.onclick = () => {
          vscode.postMessage({ type: 'applyAll', edits: m.edits });
          applyAll.textContent = 'Applied';
          applyAll.disabled = true;
        };
        div.appendChild(applyAll);
      }
      if (config.showSources && Array.isArray(m.sources) && m.sources.length) {
        const box = document.createElement('div');
        box.className = 'sources';
        box.innerHTML = '<div class="sources-title">Sources</div>';
        m.sources.forEach((s, i) => {
          if (!s || !s.url) return;
          const a = document.createElement('a');
          a.href = s.url;
          const n = document.createElement('span'); n.className = 'n'; n.textContent = '[' + (i + 1) + ']';
          const t = document.createElement('span'); t.textContent = s.title || s.url;
          a.appendChild(n); a.appendChild(t);
          box.appendChild(a);
        });
        div.appendChild(box);
      }
      div.querySelectorAll('pre').forEach(pre => {
        const btn = document.createElement('button');
        btn.className = 'copy-code';
        btn.textContent = 'Copy';
        btn.onclick = () => {
          const code = pre.querySelector('code');
          navigator.clipboard.writeText(code ? code.textContent : pre.textContent);
          btn.textContent = 'Copied';
          setTimeout(() => btn.textContent = 'Copy', 1200);
        };
        pre.appendChild(btn);
        try { if (window.hljs) hljs.highlightElement(pre.querySelector('code')); } catch (e) {}
      });
    } else {
      div.textContent = m.content;
    }
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    if (m.role === 'assistant') {
      const cp = document.createElement('button');
      cp.textContent = 'Copy';
      cp.onclick = () => navigator.clipboard.writeText(m.content);
      actions.appendChild(cp);
      const rg = document.createElement('button');
      rg.textContent = 'Regenerate';
      rg.onclick = () => regenerate(idx);
      actions.appendChild(rg);
    } else {
      const ed = document.createElement('button');
      ed.textContent = 'Edit';
      ed.onclick = () => editMessage(idx);
      actions.appendChild(ed);
    }
    div.appendChild(actions);
    msgsEl.appendChild(div);
  });
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function renderChips() {
  chipsEl.innerHTML = '';
  state.mentions.forEach((m, i) => {
    const c = document.createElement('span');
    c.className = 'chip mention';
    c.innerHTML = '<span class="label">@' + escapeHtml(m.path) + '</span>';
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '\u2715';
    x.onclick = () => { state.mentions.splice(i, 1); renderChips(); };
    c.appendChild(x);
    chipsEl.appendChild(c);
  });
  if (state.pendingSelection) {
    const c = document.createElement('span');
    c.className = 'chip';
    c.innerHTML = '<span>#' + escapeHtml(state.pendingSelection.path) + ':' + state.pendingSelection.startLine + '-' + state.pendingSelection.endLine + '</span>';
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '\u2715';
    x.onclick = () => { state.pendingSelection = null; renderChips(); };
    c.appendChild(x);
    chipsEl.appendChild(c);
  }
}

function send(text) {
  if (isSending || !text || !text.trim()) return;
  isSending = true;
  sendBtn.disabled = true;
  stopBtn.classList.add('on');
  streamEl = null; streamRaw = '';

  let fullText = text.trim();
  if (state.pendingSelection) {
    fullText += '\n\n[Attached selection from ' + state.pendingSelection.path +
      ' lines ' + state.pendingSelection.startLine + '-' + state.pendingSelection.endLine + ']';
  }

  state.messages.push({ role: 'user', content: text.trim() });
  renderMessages();
  inEl.value = '';
  inEl.style.height = '52px';

  const th = document.createElement('div');
  th.className = 'msg k skeleton';
  th.id = 'thinking';
  th.innerHTML = '<span></span><span></span><span></span>';
  msgsEl.appendChild(th);
  msgsEl.scrollTop = msgsEl.scrollHeight;

  const mentions = state.mentions.map(m => m.path);

  vscode.postMessage({ type: 'ask', message: fullText, mentions, webSearch: !!state.webSearch });

  state.pendingSelection = null;
  renderChips();
}

sendBtn.onclick = () => send(inEl.value);
stopBtn.onclick = () => { vscode.postMessage({ type: 'stop' }); stopBtn.classList.remove('on'); };

inEl.addEventListener('keydown', e => {
  if (slashActive && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const items = slashMenu.querySelectorAll('.slash-item');
    slashIndex = Math.max(0, Math.min(items.length - 1, slashIndex + (e.key === 'ArrowDown' ? 1 : -1)));
    items.forEach((it, i) => it.classList.toggle('active', i === slashIndex));
    return;
  }
  if (slashActive && e.key === 'Enter') { e.preventDefault(); const a = slashMenu.querySelector('.slash-item.active'); if (a) a.click(); return; }
  if (slashActive && e.key === 'Escape') { closeSlash(); return; }
  if (acMode && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const items = acEl.querySelectorAll('.ac-item');
    if (!items.length) return;
    acIndex = Math.max(0, Math.min(items.length - 1, acIndex + (e.key === 'ArrowDown' ? 1 : -1)));
    items.forEach((it, i) => it.classList.toggle('active', i === acIndex));
    return;
  }
  if (acMode && e.key === 'Enter') { e.preventDefault(); const a = acEl.querySelector('.ac-item.active'); if (a) a.click(); return; }
  if (acMode && e.key === 'Escape') { closeAc(); return; }
  if (e.key === 'Enter' && !e.shiftKey && !acMode && !slashActive) { e.preventDefault(); sendBtn.click(); }
});

inEl.addEventListener('input', () => {
  inEl.style.height = '52px';
  inEl.style.height = Math.min(inEl.scrollHeight, 180) + 'px';
  checkAutocomplete();
  checkSlashMenu();
});

const SLASH_CMDS = [
  { cmd: '/explain', desc: 'Explain selected code step by step' },
  { cmd: '/fix', desc: 'Find and fix bugs' },
  { cmd: '/test', desc: 'Write unit tests' },
  { cmd: '/doc', desc: 'Add documentation' },
  { cmd: '/refactor', desc: 'Improve readability' },
  { cmd: '/optimize', desc: 'Improve performance' }
];

function checkSlashMenu() {
  const match = inEl.value.match(/^\/(\w*)$/);
  if (!match) { closeSlash(); return; }
  const q = match[1].toLowerCase();
  const items = SLASH_CMDS.filter(c => c.cmd.slice(1).startsWith(q));
  if (!items.length) { closeSlash(); return; }
  slashActive = true; slashIndex = 0;
  slashMenu.innerHTML = '';
  items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'slash-item' + (i === 0 ? ' active' : '');
    el.innerHTML = '<span class="cmd">' + it.cmd + '</span><span class="desc">' + it.desc + '</span>';
    el.onclick = () => { inEl.value = it.cmd + ' '; closeSlash(); inEl.focus(); };
    slashMenu.appendChild(el);
  });
  slashMenu.classList.add('on');
}

function closeSlash() { slashActive = false; slashMenu.classList.remove('on'); slashMenu.innerHTML = ''; }

function checkAutocomplete() {
  const val = inEl.value, pos = inEl.selectionStart, before = val.slice(0, pos);
  const atMatch = before.match(/@([^\s]*)$/);
  const hashMatch = before.match(/#([^\s]*)$/);
  if (atMatch) { openFileAc(atMatch[1]); return; }
  if (hashMatch) { openSelectionAc(); return; }
  closeAc();
}

function openFileAc(query) {
  if (!fileList.length) vscode.postMessage({ type: 'getFiles', limit: 300 });
  const q = query.toLowerCase();
  if ('problems'.startsWith(q)) { renderAc([{ label: 'problems', type: 'diag' }], 'file'); return; }
  if ('git'.startsWith(q)) { renderAc([{ label: 'git', type: 'vcs' }], 'file'); return; }
  const matches = fileList.filter(f => f.toLowerCase().includes(q)).slice(0, 20);
  renderAc(matches.map(f => ({ label: f, type: 'file' })), 'file');
}

function openSelectionAc() {
  vscode.postMessage({ type: 'getSelection' });
  acMode = 'selection';
  acEl.innerHTML = '<div class="ac-item">Attach current editor selection...</div>';
  acEl.classList.add('on');
}

function renderAc(items, mode) {
  acMode = mode; acIndex = 0;
  if (!items.length) { closeAc(); return; }
  acEl.innerHTML = '';
  items.forEach((it, i) => {
    const div = document.createElement('div');
    div.className = 'ac-item' + (i === 0 ? ' active' : '');
    div.innerHTML = '<span>' + escapeHtml(it.label) + '</span><span class="type">' + escapeHtml(it.type || '') + '</span>';
    div.onclick = () => {
      if (mode === 'file') {
        const val = inEl.value, pos = inEl.selectionStart;
        const before = val.slice(0, pos).replace(/@[^\s]*$/, '');
        const after = val.slice(pos);
        inEl.value = before + after;
        if (!state.mentions.find(x => x.path === it.label)) { state.mentions.push({ path: it.label }); renderChips(); }
      }
      closeAc();
      inEl.focus();
    };
    acEl.appendChild(div);
  });
  acEl.classList.add('on');
}

function closeAc() { acMode = null; acEl.classList.remove('on'); acEl.innerHTML = ''; }

function regenerate(idx) {
  let ui = idx - 1;
  while (ui >= 0 && state.messages[ui].role !== 'user') ui--;
  if (ui < 0) return;
  const text = state.messages[ui].content;
  state.messages = state.messages.slice(0, ui);
  renderMessages();
  send(text);
}

function editMessage(idx) {
  const m = state.messages[idx];
  if (!m || m.role !== 'user') return;
  inEl.value = m.content;
  inEl.focus();
  state.messages = state.messages.slice(0, idx);
  renderMessages();
}

function dateGroup(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diffDays = Math.floor((now - d) / 86400000);
  if (diffDays === 0 && d.getDate() === now.getDate()) return 'Today';
  if (diffDays <= 1) return 'Yesterday';
  if (diffDays <= 7) return 'This Week';
  return 'Older';
}

function renderDrawer() {
  const q = (drawerSearch.value || '').toLowerCase();
  const filtered = conversations.filter(c => !q || (c.title || '').toLowerCase().includes(q));
  drawerList.innerHTML = '';
  if (!filtered.length) {
    drawerList.innerHTML = '<div class="conv-empty">' + (q ? 'No matches' : 'No conversations yet') + '</div>';
    return;
  }
  const groups = { 'Today': [], 'Yesterday': [], 'This Week': [], 'Older': [] };
  filtered.forEach(c => { groups[dateGroup(c.updatedAt)].push(c); });
  Object.keys(groups).forEach(label => {
    if (!groups[label].length) return;
    const heading = document.createElement('div');
    heading.className = 'group-label';
    heading.textContent = label;
    drawerList.appendChild(heading);
    groups[label].forEach(c => {
      const row = document.createElement('div');
      row.className = 'conv-row' + (c.id === currentId ? ' on' : '');
      const title = document.createElement('span');
      title.className = 'conv-title';
      title.textContent = c.title || 'New Chat';
      const del = document.createElement('span');
      del.className = 'conv-del';
      del.textContent = '\u2715';
      del.onclick = (e) => {
        e.stopPropagation();
        if (!config.confirmDelete || confirm('Delete this conversation?')) {
          vscode.postMessage({ type: 'deleteConversation', id: c.id });
        }
      };
      row.appendChild(title);
      row.appendChild(del);
      row.onclick = () => { vscode.postMessage({ type: 'selectConversation', id: c.id }); closeDrawers(); };
      drawerList.appendChild(row);
    });
  });
}

function openDrawer() { closeSettings(); drawer.classList.add('on'); overlay.classList.add('on'); renderDrawer(); }
function closeDrawer() { drawer.classList.remove('on'); if (!settingsDrawer.classList.contains('on')) overlay.classList.remove('on'); }
function openSettings() { closeDrawer(); settingsDrawer.classList.add('on'); overlay.classList.add('on'); }
function closeSettings() { settingsDrawer.classList.remove('on'); if (!drawer.classList.contains('on')) overlay.classList.remove('on'); }
function closeDrawers() { drawer.classList.remove('on'); settingsDrawer.classList.remove('on'); overlay.classList.remove('on'); }

chatsBtn.onclick = openDrawer;
settingsBtn.onclick = openSettings;
overlay.onclick = closeDrawers;
drawerNew.onclick = () => { vscode.postMessage({ type: 'newChat' }); closeDrawers(); };
settingsClose.onclick = closeSettings;
drawerSearch.addEventListener('input', renderDrawer);

webBtn.onclick = () => { state.webSearch = !state.webSearch; webBtn.classList.toggle('on', state.webSearch); };
clearBtn.onclick = () => vscode.postMessage({ type: 'clearCurrent' });

function setToggle(id, value) {
  const el = $(id);
  el.classList.toggle('on', !!value);
}

function updateSettingsUI() {
  $('set-model').value = config.model || 'auto';
  $('set-temperature').value = config.temperature;
  $('tempVal').textContent = Number(config.temperature).toFixed(2);
  setToggle('set-autoApply', config.autoApply);
  setToggle('set-webSearchByDefault', config.webSearchByDefault);
  setToggle('set-showSources', config.showSources);
  setToggle('set-confirmDelete', config.confirmDelete);
  $('set-maxContextFiles').value = config.maxContextFiles;
  $('set-workerUrl').value = config.workerUrl;
  modelBadge.textContent = config.model === 'code-master' ? 'code-master' : config.model;
}

function wireSetting(key, id, getter) {
  const el = $(id);
  if (!el) return;
  el.addEventListener('change', () => {
    const value = getter ? getter(el) : el.value;
    vscode.postMessage({ type: 'updateSetting', key, value });
  });
}

$('set-model').addEventListener('change', () => {
  vscode.postMessage({ type: 'updateSetting', key: 'model', value: $('set-model').value });
});
$('set-temperature').addEventListener('input', () => {
  $('tempVal').textContent = Number($('set-temperature').value).toFixed(2);
});
$('set-temperature').addEventListener('change', () => {
  vscode.postMessage({ type: 'updateSetting', key: 'temperature', value: Number($('set-temperature').value) });
});
['autoApply', 'webSearchByDefault', 'showSources', 'confirmDelete'].forEach(key => {
  const el = $('set-' + key);
  el.addEventListener('click', () => {
    const newVal = !el.classList.contains('on');
    el.classList.toggle('on', newVal);
    vscode.postMessage({ type: 'updateSetting', key, value: newVal });
  });
});
$('set-maxContextFiles').addEventListener('change', () => {
  vscode.postMessage({ type: 'updateSetting', key: 'maxContextFiles', value: Number($('set-maxContextFiles').value) });
});
$('set-workerUrl').addEventListener('change', () => {
  vscode.postMessage({ type: 'updateSetting', key: 'workerUrl', value: $('set-workerUrl').value });
});
$('resetSettings').addEventListener('click', () => vscode.postMessage({ type: 'resetSettings' }));

webBtn.classList.toggle('on', state.webSearch);

window.addEventListener('message', e => {
  const msg = e.data;
  if (!msg || !msg.type) return;

  if (msg.type === 'config') {
    config = msg.config || config;
    updateSettingsUI();
    return;
  }

  if (msg.type === 'loadConversation') {
    currentId = msg.id;
    state.messages = Array.isArray(msg.messages) ? msg.messages.slice() : [];
    renderMessages();
    renderDrawer();
    return;
  }

  if (msg.type === 'conversationsList') {
    conversations = msg.conversations || [];
    currentId = msg.currentId;
    renderDrawer();
    return;
  }

  if (msg.type === 'chunk') {
    const th = document.getElementById('thinking');
    if (th) th.remove();
    if (!streamEl) {
      streamEl = document.createElement('div');
      streamEl.className = 'msg k streaming';
      msgsEl.appendChild(streamEl);
    }
    streamRaw += msg.delta || '';
    streamEl.innerHTML = renderMarkdown(streamRaw);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return;
  }

  if (msg.type === 'done') {
    const th = document.getElementById('thinking');
    if (th) th.remove();
    if (streamEl) streamEl.classList.remove('streaming');
    streamEl = null; streamRaw = '';
    state.messages.push({
      role: 'assistant',
      content: msg.reply || 'No response.',
      edits: Array.isArray(msg.edits) ? msg.edits : [],
      sources: Array.isArray(msg.sources) ? msg.sources : []
    });
    renderMessages();
    isSending = false; sendBtn.disabled = false; stopBtn.classList.remove('on');
    return;
  }

  if (msg.type === 'aborted') {
    const th = document.getElementById('thinking');
    if (th) th.remove();
    if (streamEl && streamRaw) {
      streamEl.classList.remove('streaming');
      streamEl.innerHTML = renderMarkdown(streamRaw) + '<div class="sources"><div class="sources-title">Stopped</div></div>';
      state.messages.push({ role: 'assistant', content: streamRaw + '\n\n*(stopped)*' });
    }
    streamEl = null; streamRaw = '';
    isSending = false; sendBtn.disabled = false; stopBtn.classList.remove('on');
    return;
  }

  if (msg.type === 'error') {
    const th = document.getElementById('thinking');
    if (th) th.remove();
    state.messages.push({ role: 'assistant', content: '**Error:** ' + (msg.message || 'Unknown error') });
    renderMessages();
    isSending = false; sendBtn.disabled = false; stopBtn.classList.remove('on');
    return;
  }

  if (msg.type === 'fileList') { fileList = msg.files || []; checkAutocomplete(); return; }

  if (msg.type === 'selectionInfo') {
    if (msg.selection) {
      state.pendingSelection = msg.selection;
      renderChips();
      inEl.value = inEl.value.replace(/#[^\s]*$/, '');
      closeAc();
    } else { closeAc(); }
    return;
  }

  if (msg.type === 'insertPrompt') {
    inEl.value = msg.prompt || '';
    inEl.focus();
    inEl.style.height = '52px';
    inEl.style.height = Math.min(inEl.scrollHeight, 180) + 'px';
    if (msg.autoSend) send(inEl.value);
    return;
  }
});

updateSettingsUI();
renderChips();
renderMessages();
inEl.focus();
vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
